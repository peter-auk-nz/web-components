<!DOCTYPE html>
    <html lang="en">
    <head>
            <meta charset="UTF-8">
            <title>Geometry Sandbox</title>
        <style>
            body { margin: 0; background: #0a0a1a }
        </style>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
            camera.position.z = 3;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Triangle 1 — blue
            // Three vertices - each is x, y, z
            const vertices1 = new Float32Array([
            -1, 1, 0, // vertex 0 - top (x = 0, y = 1, z = 0 )
            -1, -1, 0, // vertex 1 - bottom left (x = 1, y = 1, z = 0)
            1, -1, 0, // vertex 2 - bottom right (x = 1, y = -1, z = 0)
            ]);
            const geo1 = new THREE.BufferGeometry();
            geo1.setAttribute('position', new THREE.BufferAttribute(vertices1, 3));
            const mat1 = new THREE.MeshBasicMaterial({ color: 0x32CD32, side: THREE.DoubleSide });
            const tri1 = new THREE.Mesh(geo1, mat1);
            scene.add(tri1);
            

            // Triangle 2 — orange
            const vertices2 = new Float32Array([
            -1, 1, 0, // Top left
            1, -1, 0, // bottom right
            1, 1, 0 // top right
            ]);
            const geo2 = new THREE.BufferGeometry();
            geo2.setAttribute('position', new THREE.BufferAttribute(vertices2, 3));
            const mat2 = new THREE.MeshBasicMaterial({ color: 0xff6600, side: THREE.DoubleSide });
            const tri2 = new THREE.Mesh(geo2, mat2);
            scene.add(tri2);

            function animate() {
                requestAnimationFrame(animate);
                tri1.rotation.y += 0.01;
                tri2.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
        </script>
    </body>
</html>

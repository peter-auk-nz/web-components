<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Solar System</title>
        <style>
            body {
                font-family: "Noto Sans", sans-serif;
                background: #0a0a1a;
                color: #fff;
                padding: 2rem;
            }

            h1 {
                text-align: center;
            }
        
            .planet-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 2rem;
                column-rule: 1px solid #667eea;
                row-rule: 1px solid #667eea;
            }

            .planet {
                text-align: center;
                padding: 1.5rem
            }

            .planet-emoji {
                font-size: 4rem;
            }
        </style>
    </head>
    <body>
        <h1>&#9883; Our Solar System</h1>
        <div class="planet">
            <div class="planet-emoji">☀️</div>
            <h2>Sun</h2>
            <p>Our star — 1.4 million km across</p>
        </div>
    </div>

    <div class="planet">
        <div class="planet-emoji">🟡</div>
            <h2>Venus</h2>
            <p>Hottest planet — 465&#176;C surface</p>
        </div>
    </div>
</body>
</html>

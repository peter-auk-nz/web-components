<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Sandbox</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Three.js loaded from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Create the scene (the empty 3D world)
        const scene = new THREE.Scene();

        // 2. Create a camera (the viewpoint)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

       // 3. Create a renderer (the engine that draws the scene)
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Create a mesh (geometry + material) and add it to the scene
        const geometry = new THREE.BoxGeometry(2, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0088, wireframe: false });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Create a sphere
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(2, 0, 0); // Position the sphere to the right of the cube
        scene.add(sphere);

        // 5. Animation loop (rotate the cube and render the scene)
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the cube for some basic animation
            cube.rotation.x += 0.001;
            cube.rotation.y += 0.005;
            cube.rotation.z += 0.002;
            sphere.rotation.x += 0.05;
            sphere.rotation.y += 0.01;
            sphere.rotation.z += 0.02;
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

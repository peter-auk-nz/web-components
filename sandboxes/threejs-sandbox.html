<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Sandbox</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Three.js loaded from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Create the scene (the empty 3D world)
        const scene = new THREE.Scene();

        // 2. Create a camera (the viewpoint)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Add ambient light to the scene (general background light)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Add directional light to the scene (like the sun)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);
        
        const directionalLight2 = new THREE.DirectionalLight(0xff8800, 0.5);
        directionalLight2.position.set(-5, -3, 2);
        scene.add(directionalLight2);

        // Starfield background
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i ++) {
            starPositions[i] = (Math.random() - 0.5) * 200; // x
        }

        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        // The Sun
        const sunGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffa500,
            emissive: 0xffa500,
            emissiveIntensity: 1
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Sunlight
        const sunLight = new THREE.PointLight(0xffa500, 2, 100);
        sun.position.set(-8, 2, -8);
        sunLight.position.set(-8, 2, -8);
        scene.add(sunLight);
        // Sun Corona (glowing outer layer)
        const coronaGeometry = new THREE.SphereGeometry(1.8, 32, 32);
        const coronaMaterial = new THREE.MeshBasicMaterial({
            color: 0xff6600,
            emissive: 0xff4400,
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.3
        });

        const corona = new THREE.Mesh(coronaGeometry, coronaMaterial);
        corona.position.set(-8, 2, -8);
        scene.add(corona);

        // 3. Create a renderer (the engine that draws the scene)
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        // OrbitControls allow the camera to orbit around a target
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true
        controls.dampingFactor = 0.05;

        // 4. Create a mesh (geometry + material) and add it to the scene
        const geometry = new THREE.DodecahedronGeometry(0.4, 0); // Create a dodecahedron geometry
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x8b7355,
            roughness: 1,
            metalness: 0
        });

        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(-2, 0.5, 0);
        scene.add(cube);

        // Create a sphere
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        
        //Load Earth texture 
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        const sphereMaterial = new THREE.MeshStandardMaterial({ 
            map: earthTexture,
            roughness: 0.8,
            metalness: 0.1
         });

        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(2, 0, 0); // Position the sphere to the right of the cube
        scene.add(sphere);

        // Moon sphere
        const moonGeometry = new THREE.SphereGeometry(0.27, 32, 32);
        const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        scene.add(moon);

        // Saturn with rings
        const saturnGeometry = new THREE.SphereGeometry(0.8, 32, 32);
        const saturnTexture = textureLoader.load('textures/preview_saturn.jpg');
        const saturnMaterial = new THREE.MeshStandardMaterial({ map: saturnTexture });
        const saturn = new THREE.Mesh(saturnGeometry, saturnMaterial);
        saturn.position.set(5, 0, -2);
        scene.add(saturn);

        // Saturn's ring geometry
        const ringGeometry = new THREE.TorusGeometry(1.4, 0.2, 2, 64) ;

        // Saturn's rings texture
        const ringTexture = textureLoader.load('textures/preview_saturn_ring.jpg');
        const ringMaterial = new THREE.MeshStandardMaterial({ 
            map: ringTexture,
            side: THREE.DoubleSide, 
            transparent: true,
            opacity: 0.9
        });

        // Saturn's rings mesh
        const rings = new THREE.Mesh(ringGeometry, ringMaterial);
        rings.position.set(5, 0, -2);
        rings.rotation.x = Math.PI / 3;
        scene.add(rings);

        // Mercury
        const mercuryGeometry = new THREE.SphereGeometry(0.3, 32, 32);
        const mercuryTexture = textureLoader.load('textures/preview_mercury.jpg');
        const mercuryMaterial = new THREE.MeshStandardMaterial({ map: mercuryTexture });
        const mercury = new THREE.Mesh(mercuryGeometry, mercuryMaterial);
        mercury.position.set(-5, 0.5, -4);
        scene.add(mercury);

        // Venus
        const venusGeometry = new THREE.SphereGeometry(0.9, 32, 32);
        const venusTexture = textureLoader.load('textures/preview_venus_surface.jpg');
        const venusMaterial = new THREE.MeshStandardMaterial({ map: venusTexture});
        const venus = new THREE.Mesh(venusGeometry, venusMaterial);
        venus.position.set(-1, 0, 2);
        scene.add(venus);

        // Jupiter
        const jupiterGeometry = new THREE.SphereGeometry(1.2, 32, 32);
        const jupiterTexture = textureLoader.load('textures/preview_jupiter.jpg');
        const jupiterMaterial = new THREE.MeshStandardMaterial({ map: jupiterTexture });
        const jupiter = new THREE.Mesh(jupiterGeometry, jupiterMaterial);
        jupiter.position.set(-4, 0, -2);
        scene.add(jupiter);

        // Mars
        const marsGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const marsTexture = textureLoader.load('textures/preview_mars.jpg');
        const marsMaterial = new THREE.MeshStandardMaterial({ map: marsTexture });
        const mars = new THREE.Mesh(marsGeometry, marsMaterial);
        mars.position.set(2, 1, -2);
        scene.add(mars);

        // Cosmos - our friendly space robot!
        const cosmos = new THREE.Group();
        const cosmosBody = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x5dade2,})
        );
        cosmosBody.scale.set(1, 1.5, 0.9);
        cosmos.add(cosmosBody);

        const cosmosHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x85c1e9})
        );
        cosmosHead.position.set(0, 0.5, 0);
        cosmos.add(cosmosHead);

        // Cosmos eyes
        const eyeGeometry = new THREE.SphereGeometry(0.03, 8, 8);
        const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        
        const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        leftEye.position.set(-0.07, 0.52, 0.18);
        cosmos.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
        rightEye.position.set(0.07, 0.52, 0.18);
        cosmos.add(rightEye);

        // Cosmos antenna
        const antennaStem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8),
            new THREE.MeshStandardMaterial({ color: 0xf4d03f })
        );
        antennaStem.position.set(0, 0.72, 0);
        cosmos.add(antennaStem);

        const antennaTip = new THREE.Mesh(
            new THREE.SphereGeometry(0.03, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0xf4d03f })
        );
        antennaTip.position.set(0, 0.80, 0);
        cosmos.add(antennaTip);

        // Cosmos arms
        const armGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8);
        const armMaterial = new THREE.MeshStandardMaterial({ color: 0x3498db });

        const leftArm = new THREE.Mesh(armGeometry, armMaterial);
        leftArm.position.set(-0.35, 0.1, 0);
        leftArm.rotation.z = Math.PI / 4;
        cosmos.add(leftArm);

        const rightArm = new THREE.Mesh(armGeometry, armMaterial);
        rightArm.position.set(0.35, 0.1, 0);
        rightArm.rotation.z = -Math.PI / 4;
        cosmos.add(rightArm);

        // Cosmos legs
        const legGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.45, 8);
        
        const leftleg = new THREE.Mesh(legGeometry, armMaterial);
        leftleg.position.set(-0.12, -0.45, 0);
        cosmos.add(leftleg);

        const rightleg = new THREE.Mesh(legGeometry, armMaterial);
        rightleg.position.set(0.12, -0.45, 0);
        cosmos.add(rightleg);

        const footGeometry = new THREE.SphereGeometry(0.07, 8, 8);
        const footMaterial = new THREE.MeshStandardMaterial({ color: 0xf4d03f });
        
        const leftFoot = new THREE.Mesh(footGeometry, footMaterial);
        leftFoot.position.set(-0.12, -0.65, 0);
        cosmos.add(leftFoot);

        const rightFoot = new THREE.Mesh(footGeometry, footMaterial);
        rightFoot.position.set(0.12, -0.65, 0);
        cosmos.add(rightFoot);

        cosmos.position.set(0, 0.5, 0);
        scene.add(cosmos);

        // 5. Animation loop (rotate the cube and render the scene)
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Update controls for damping
        // Rotate the cube for some basic animation
        cube.rotation.x += 0.001;
        cube.rotation.y += 0.005;
        cube.rotation.z += 0.002;
        sphere.rotation.x += 0.001;
        sphere.rotation.y += 0.005;
        sphere.rotation.z += 0.002;
        starField.rotation.y += 0.0002; // Slowly rotate the starfield for a dynamic background
        const time = Date.now() * 0.001; // Time in seconds
        moon.position.x = sphere.position.x + Math.cos(time) * 1.5; // Orbit around the sphere
        moon.position.z = sphere.position.z + Math.sin(time) * 1.5;
        saturn.rotation.y += 0.015; // Slowly rotate Saturn
        rings.rotation.x = Math.PI / 4;
        rings.rotation.z += 0.015; // Slowly rotate Saturn's rings
        mercury.rotation.y += 0.001;
        venus.rotation.y -= 0.002 // Note the minus - Venus rotate backwards
        jupiter.rotation.y += 0.008; // Slowly rotate Jupiter
        cosmos.rotation.y += 0.005; // Slowly rotate the friendly robot
        cosmos.position.x = 0.002 + Math.sin(time * 2) * 0.1; // Gentle bobbing motion for the robot
        mars.rotation.y += 0.008;
        
        renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

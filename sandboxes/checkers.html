<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Checkers</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background: #1a1a2e;
            }

            .board {
                display: grid;
                grid-template-columns: repeat(8, 70px);
                grid-template-rows: reapeat(8, 70px);
                border: 3px solid #ffd700;
                gap: 2px;
                background: #333333
            }

            .square {
                width: 70px;
                height: 70px;
            }

            .light { background: #f0d9b5; }
            .dark { background: #b58863; }

            .piece {
                width: 54px;
                height: 54px;
                border-radius: 50%;
                margin: 8px auto;
                border: 3px solid rgba(0, 0, 0, 0, 3);
            }

            .red { background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b); }
            .green { background: radial-gradient(circle at 35% 35%, #55efc4, #00b894); }

            .selected { border: 4px solid yellow; }
            
            .square {  
                width: 70px;
                height: 70px;
                box-sizing: border-box;
                cursor: pointer;
            }

            .game {
                display: flex;
                gap: 2rem;
                align-items: flex-start;
            }

            .sidebar {
                background: rgba(255,255,255,0.1 );
                padding: 1rem;
                border-radius: 8px;
                color: white;
                min-width: 100px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="game">
            <div class="sidebar">
                <h3>🟠Orange</h3>
                <div id="orange-captured"></div>
                <h3>🟢Green</h3>
                <div id="green-captured"></div>
            </div>
            <div class="board" id="board"></div>
        </div>


        <script>
            const board = document.getElementById('board');
            let selectedSquare = null;
            let currentPlayer = 'red';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                square.classList.add('square');
                const isDark = (row + col) % 2 !== 0;
                square.classList.add(isDark ? 'dark' : 'light');

            if (isDark && row < 3) {
                const piece = document.createElement('div');
                piece.classList.add('piece', 'red');
                square.appendChild(piece);
            }
            if (isDark && row > 4) {
                const piece = document.createElement('div');
                piece.classList.add('piece', 'green');
                square.appendChild(piece);
            }

            square.addEventListener('click', () => {
                const piece = square.querySelector('.piece');
                

                if (selectedSquare && isDark) {
                    const movingPiece = selectedSquare.querySelector('.piece');
                    
                    // Check it's the right player's piece
                    if (movingPiece && movingPiece.classList.contains(currentPlayer === 'red' ? 'red' : 'green')) {
                        // Check if there's an opponent piece to capture
                        const opponentPiece = square.querySelector('.piece');
                        if (opponentPiece) {
                            const captureDiv = getElementById(currentPlayer === 'red' ? 'orange-captured' : 'green-captured');
                            const cap = document.createElement('div');
                            cap.classList.add('piece', opponentPiece.classList.contains('red') ? 'red' : 'green');
                            capturedDiv.appendChild(cap);
                            opponentPiece.remove();
                        }
                        square.appendChild(movingPiece);
                        selectedSquare.classList.remove('selected');
                        selectedSquare = null;
                        // Switch turns
                        currentPlayer = currentPlayer === 'red' ? 'green' : 'red';
                    }

                } else if (piece) {
                    if (selectedSquare) {
                        selectedSquare.classList.remove('selected');
                    }
                }
                    square.classList.add('selected');
                    selectedSquare = square;
                });

            board.appendChild(square);

            }
        }   
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Checkers</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background: #1a1a2e;
            }

            .board {
                display: grid;
                grid-template-columns: repeat(8, 70px);
                grid-template-rows: reapeat(8, 70px);
                border: 3px solid #ffd700;
                gap: 2px;
                background: #333333
            }

            .square {
                width: 70px;
                height: 70px;
            }

            .light { background: #f0d9b5; }
            .dark { background: #b58863; }

            .piece {
                width: 54px;
                height: 54px;
                border-radius: 50%;
                margin: 8px auto;
                border: 3px solid rgba(0, 0, 0, 0, 3);
            }

            .red { background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b); }
            .green { background: radial-gradient(circle at 35% 35%, #55efc4, #00b894); }

            .selected { border: 4px solid yellow; }
            
            .square {  
                width: 70px;
                height: 70px;
                box-sizing: border-box;
                cursor: pointer;
            }

            .game {
                display: flex;
                gap: 2rem;
                align-items: flex-start;
            }

            .sidebar {
                background: rgba(255,255,255,0.1 );
                padding: 1rem;
                border-radius: 8px;
                color: white;
                min-width: 100px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="game">
            <div class="sidebar">
                <h3>🟠Orange</h3>
                <div id="orange-capture"></div>
                <h3>🟢Green</h3>
                <div id="green-capture"></div>
            </div>
            <div class="board" id="board"></div>
        </div>


        <script>
            const board = document.getElementById('board');
            let selectedSquare = null;
            let currentPlayer = 'red';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                square.classList.add('square');
                square.dataset.row = row;
                square.dataset.col = col;
                const isDark = (row + col) % 2 !== 0;
                square.classList.add(isDark ? 'dark' : 'light');

            if (isDark && row < 3) {
                const piece = document.createElement('div');
                piece.classList.add('piece', 'red');
                square.appendChild(piece);
            }
            if (isDark && row > 4) {
                const piece = document.createElement('div');
                piece.classList.add('piece', 'green');
                square.appendChild(piece);
            }

            square.addEventListener('click', () => {
                console.log('Square clicked!', isDark, currentPlayer);
                const piece = square.querySelector('.piece');
                const movingPiece = selectedSquare ? selectedSquare.querySelector('.piece') : null;
                
                // Check it's the right player's piece
                if (selectedSquare && isDark) {
                    if (selectedSquare && movingPiece.classList.contains(currentPlayer)) { 

                const fromRow =  parseInt(selectedSquare.dataset.row);
                const fromCol =  parseInt(selectedSquare.dataset.col);
                const toRow = parseInt(square.dataset.row);
                const toCol = parseInt(square.dataset.col);

                const rowDiff = toRow - fromRow;
                const colDiff = Math.abs(toCol - fromCol);

                if (colDiff !== 1 || Math.abs(rowDiff) !== 1) return;  // Invalid move: must move diagonally by one square.
                if (currentPlayer === 'red' && rowDiff !== 1) return; // Red pieces can only move downwards
                if (currentPlayer === 'green' && rowDiff !== -1) return;
                
                // Can't move to a square with your own piece
                if (piece && piece.classList.contains(currentPlayer)) {
                        selectedSquare.classList.remove('selected');
                    selectedSquare = null;
                        return;
                    }

                        // Capture opponent piece if present
                        if (piece && !piece.classList.contains(currentPlayer)) {
                            console.log('Capturing piece!', piece);
                            console.log('Found opponent piece to capture:', piece);
                            const captureDiv = document.getElementById(currentPlayer === 'red' ? 'orange-capture' : 'green-capture');
                            const cap = document.createElement('div');
                            cap.classList.add('piece', piece.classList.contains('red') ? 'red' : 'green');
                            captureDiv.appendChild(cap);
                            piece.remove();
                        }
                        
                        // Move the piece
                        square.appendChild(movingPiece);
                        selectedSquare.classList.remove('selected');
                        selectedSquare = null;
                        // Switch turns
                        currentPlayer = currentPlayer === 'red' ? 'green' : 'red';
                        return;
                    }
                }
                    // Select a piece if it's the current player's turn
                    if (selectedSquare) {
                        selectedSquare.classList.remove('selected');
                        selectedSquare = null;
                    }
                    if (piece && piece.classList.contains(currentPlayer)) {
                        square.classList.add('selected');
                        selectedSquare = square;
                    }
                });

            board.appendChild(square);

                }
            }
          
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Platonic Solids</title>
        <style>
            body { margin: 0; background: #0a0a1a; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

        <script>
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 8;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const light = new THREE.PointLight(0xffffff, 1.5);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // Tetrahedron - 4 faces
            const tetra = new THREE.Mesh(
                new THREE.TetrahedronGeometry(1),
                new THREE.MeshStandardMaterial({ color: 0x667eea, wireframe: false })
        );
        tetra.position.set(-4, 0, 0);
        scene.add(tetra);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            tetra.rotation.x += 0.01;
            tetra.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
        </script>
    </body>
</html>

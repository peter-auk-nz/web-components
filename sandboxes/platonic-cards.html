<!DOCTYPE html>
<html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Platonic Solids</title>
            <style>
                body { font-family: sans-serif; background: #0a0a1a; color: #ffffff; padding: 2rem; }
                h1 { text-align: center; }
                .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2rem; column-rule: 1px solid #667eea; row-rule: 1px solid #667eea; }
                .card { text-align: center; padding: 1rem; background: rgba(102, 126, 234, 0.08); border-radius: 12px }
            </style>
        </head>
        <body>
            <h1>Platonic Solids</h1>
            <!-- Tetra card -->
            <div class="cards">
                <div class="card">
                <canvas id="tetra"></canvas>
                <h2>Tetrahedron</h2>
                <p>4 triangular faces</p>
                <p>🔥Element of fire</p>
            </div>
        
            <!-- Cube card -->
            <div class="card">
                <canvas id="cube"></canvas>
                <h2>Cube</h2>
                <p>6 square faces</p>
                <p>🌍Element of Earth</p>
            </div>

            <!-- Octa card -->
            <div class="card">
                <canvas id="octa"></canvas>
                <h2>Octahedron</h2>
                <p>8 triangular faces</p>
                <p>💨Element of air</p>
            </div>

            <!-- Dodeca card -->
            <div class="card">
                <canvas id ="dodeca"></canvas>
                <h2>Dodecahedron</h2>
                <p>12 pentagonal faces</p>
                <p>🌌Element of Cosmos</p>
            </div>
        
            <!-- Icosa card -->
            <div class="card">
                <canvas id="icosa"></canvas>
                <h2>Icosahedron</h2>
                <p>20 triangular faces</p>
                <p>💧Element of water</p>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
            function createScene(canvasId, geometry, color) {
                const canvas = document.getElementById(canvasId);
                const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                renderer.setSize(300, 200);
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 300 / 200, 0.1, 100);
                camera.position.z = 3;
                scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const light = new THREE.PointLight(0xffffff, 1);
                light.position.set(5, 5, 5);
                scene.add(light);
                const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color }));
                scene.add(mesh);
                function animate() { requestAnimationFrame(animate); mesh.rotation.x += 0.01; mesh.rotation.y += 0.01; renderer.render(scene, camera); }
                animate();
            }
            createScene('tetra', new THREE.TetrahedronGeometry(1), 0x667eea);
            createScene('cube', new THREE.BoxGeometry(1.5, 1.5, 1.5), 0xff6600);
            createScene('octa', new THREE.OctahedronGeometry(1), 0x00ff88);
            createScene('dodeca', new THREE.DodecahedronGeometry(1), 0xff00ff);
            createScene('icosa', new THREE.IcosahedronGeometry(1), 0xfff00);
        </script>
    </body>
</html>

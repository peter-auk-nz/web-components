<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gap Decorations</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            /* Gap decorations - fully supported Chrome/Edge 149+ August 2026 */
            column-rule: 1px dotted #667eea; 
            row-rule: 1px dotted #ff6600; /* Row rule for visual separation */
        }

        /* New shorthand - sets both row and column rule at once */
        /* rule: 1px dotted #667eea; */
        
        /* New - hide rules next to empty cells */
        /* rule-visibility-items: around; */

        /* New - neat joins where the rules cross */
        /* rule-inset: overlap-join; */
        .item {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CSS Gap Decorations Sandbox</h1>
    <p>This sandbox demonstrates the use of CSS gap properties in a grid layout, along with decorative column rules.</p>

    <div class="grid">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
    </div>

    <p>Resize the window to see how the grid adapts and maintains the gap and column rule decorations.</p>
